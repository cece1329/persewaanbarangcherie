[package]
name = "cece1329/persewaanbarangcherie"
version = "0.1.0"
description = "CherieRent - Persewaan Gaun & Pakaian Atelier"

[fs]
"/app" = "."

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "0.0.0.0:8080"]
env = [
    "APP_ENV=production"
]
